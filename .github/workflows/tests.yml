name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install click requests urllib3 cryptography keyring

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

      - name: Credentials doctor smoke (non-secret output only)
        run: python skills/sap-adt-cli/scripts/sap_adt_cli.py credentials doctor
